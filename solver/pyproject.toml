[project]
name = "solver"
version = "0.1.0"
description = "CP-SAT solver service for the Weekly Scheduling Assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "ortools==9.10.4067",
  "pydantic>=2.6,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "perf: wall-clock performance budgets (run explicitly with -m perf; excluded from the default green path via -m 'not perf')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
